<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PABG Digital - Padang Besar</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-taxi: #f59e0b;
            --accent-vendor: #8b5cf6;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                height: 85vh;
                border-radius: 24px;
                border: 1px solid var(--border-color);
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            font-family: 'Baloo 2', cursive;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-taxi {
            background-color: var(--accent-taxi);
            color: #000;
        }

        .btn-vendor {
            background-color: var(--accent-vendor);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Skrin Mula / Utama -->
        <div id="screen-start" class="screen active">
            <h1 style="font-size: 32px; text-align: center; margin-top: 40px; color: var(--primary);">PABG Digital</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">Direktori Tempatan Padang Besar, Perlis</p>
            <div style="margin: auto 0; display: flex; flex-direction: column; gap: 16px;">
                <button class="btn btn-taxi" onclick="alert('Mod Pelawat Dipilih')">Masuk Sebagai Pelawat</button>
                <button class="btn btn-vendor" onclick="alert('Mod Vendor Dipilih')">Masuk Sebagai Vendor</button>
            </div>
        </div>
    </div>
</body>
</html>
